MODEL:
  WEIGHTS: ''
compute_precision:
  grad_scaler: true
  teacher:
    backbone:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
    dino_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
    ibot_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
  student:
    backbone:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp16
        buffer_dtype: fp32
    dino_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp32
        buffer_dtype: fp32
    ibot_head:
      sharding_strategy: SHARD_GRAD_OP
      mixed_precision:
        param_dtype: fp16
        reduce_dtype: fp32
        buffer_dtype: fp32
dino:
  loss_weight: 1.0
  head_n_prototypes: 8192
  head_bottleneck_dim: 256
  head_nlayers: 3
  head_hidden_dim: 2048
  koleo_loss_weight: 0.1
ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max:
  - 0.1
  - 0.3
  separate_head: false
  head_n_prototypes: 8192
  head_bottleneck_dim: 256
  head_nlayers: 3
  head_hidden_dim: 2048
  mask_min_aspect: 0.15
train:
  batch_size_per_gpu: 96
  output_dir: /public_bme2/grpdgshen/douyl/Code/CBraDINO/Backup/CBraDINO_backup2_ChAttn_PCAaug_Dynamic/dinov2/experiments/v2_PCA_ChAttn_Dynamic
  saveckp_freq: 20
  seed: 0
  num_workers: 5
  OFFICIAL_EPOCH_LENGTH: 1250
  cache_dataset: true
  centering: sinkhorn_knopp
student:
  arch: vit_base
  patch_size: 16
  drop_path_rate: 0.4
  layerscale: 1.0e-05
  drop_path_uniform: true
  pretrained_weights: ''
  ffn_layer: mlp
  block_chunks: 0
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  num_register_tokens: 4
  interpolate_antialias: false
  interpolate_offset: 0.1
  channel_embed_sh_degree: 4
teacher:
  momentum_teacher: 0.994
  final_momentum_teacher: 1
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 30
optim:
  epochs: 200
  weight_decay: 0.04
  weight_decay_end: 0.2
  base_lr: 0.0008
  lr: 0.00034641016151377546
  warmup_epochs: 30
  min_lr: 1.0e-06
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  layerwise_decay: 1.0
  adamw_beta1: 0.9
  adamw_beta2: 0.999
crops:
  global_crops_scale:
  - 0.32
  - 1.0
  local_crops_number: 8
  local_crops_scale:
  - 0.05
  - 0.32
  global_crop_channels_range:
  - 17
  - 19
  global_crop_patches_range:
  - 24
  - 30
  local_crop_channels_range:
  - 12
  - 15
  local_crop_patches_range:
  - 6
  - 12
evaluation:
  eval_period_iterations: 1000
dataset:
  data_root: /public_bme2/grpdgshen/douyl/EEG_Dataset/TUEG/TUEG_250Hz/Segment
  num_channels: 19
  num_patches_per_channel: 30
  patch_time_dim: 250
augmentation:
  global_aug_probs:
  - 1.0
  - 0.1
  local_aug_prob: 0.5
  pca_var_range:
  - 0.9
  - 0.95
  pca_weight_range:
  - 0.7
  - 1.3
  dropout_ch_prob: 0.05
  dropout_max_channels: 1
