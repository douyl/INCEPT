MODEL:
  WEIGHTS: ''
dino:
  loss_weight: 1.0  # default is 1
  head_n_prototypes: 8192
ibot:
  loss_weight: 1.0  # default is 1
  separate_head: false
  head_n_prototypes: 8192
  mask_sample_probability: 0.5
  mask_ratio_min_max:
  - 0.1
  - 0.3
  mask_min_aspect: 0.15  # default=0.3
train:
  batch_size_per_gpu: 96  # bs=1024 is base_lr=4.0e-04
  num_workers: 5
  centering: sinkhorn_knopp
dataset:
  data_root: /media/douyl/Disk4T/douyl/IDEA_Lab/Project_BCI/INCEPT/Data_Reference/TUEG/TUEG_250Hz/Segment
  num_channels: 19
  num_patches_per_channel: 30
  patch_time_dim: 250  # sampling rate 250Hz -> 1s patches
crops:
  global_crop_channels_range: [17, 19]
  global_crop_patches_range: [24, 30]
  local_crop_channels_range: [12, 15]
  local_crop_patches_range: [6, 12]
augmentation:
  global_aug_probs: [1.0, 0.1] # Global crop-1 100% augmentation, Global crop-2 10% augmentation
  local_aug_prob: 0.5          # Local crops 50% augmentation
  pca_var_range: [0.90, 0.95]  # Range to pick Top-K variance threshold (e.g., keep 90%-95% energy)
  pca_weight_range: [0.7, 1.3] # Range to scale the remaining "noise" components
  dropout_ch_prob: 0.05
  dropout_max_channels: 1
student:
  arch: vit_base
  pretrained_weights: ''
  drop_path_rate: 0.4
  num_register_tokens: 4
  ffn_layer: mlp
  block_chunks: 0
  channel_embed_sh_degree: 4
teacher:
  momentum_teacher: 0.994
  # warmup_teacher_temp_epochs: 60  # default=30
optim:
  epochs: 200
  weight_decay_end: 0.2
  base_lr: 8.0e-04  # learning rate for a batch size of 1024
  warmup_epochs: 30
  layerwise_decay: 1.0
evaluation:
  eval_period_iterations: 1000
